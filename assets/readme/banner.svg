    <path d="m832 225 4 4 7-8"/>
  </g>
  <g font-family="DejaVu Sans,Arial,sans-serif">
    <g fill="#f1f5f9" font-size="19" font-weight="700">
      <text x="870" y="78">Observe</text>
      <text x="870" y="155">Investigate</text>
      <text x="870" y="232">Report</text>
