<ossec_config>
  <global><jsonout_output>yes</jsonout_output><alerts_log>yes</alerts_log><logall>no</logall><logall_json>yes</logall_json></global>
  <alerts><log_alert_level>3</log_alert_level></alerts>
  <logging><log_format>plain</log_format></logging>
  <remote><connection>secure</connection><port>1514</port><protocol>tcp</protocol></remote>
  <auth><disabled>no</disabled><port>1515</port><use_source_ip>no</use_source_ip><use_password>no</use_password><ssl_verify_host>no</ssl_verify_host></auth>
  <ruleset>
    <decoder_dir>ruleset/decoders</decoder_dir><rule_dir>ruleset/rules</rule_dir>
    <list>etc/lists/audit-keys</list>
    <list>etc/lists/amazon/aws-eventnames</list>
    <list>etc/lists/security-eventchannel</list>
    <list>etc/lists/malicious-ioc/malicious-ip</list>
    <list>etc/lists/malicious-ioc/malicious-domains</list>
    <list>etc/lists/malicious-ioc/malware-hashes</list>
    <decoder_dir>etc/decoders</decoder_dir><rule_dir>etc/rules</rule_dir>
  </ruleset>
  <localfile><log_format>json</log_format><location>/lab/network.jsonl</location></localfile>
</ossec_config>
